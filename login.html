<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>會員登入｜富格停車</title>
<meta name="theme-color" content="#0a5a9c">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="富格停車 首頁">
      <img src="assets/logo.png" alt="">
      <span class="brand-text"><span class="brand-zh">富格<em>停車</em></span><span class="brand-en">FUGO <em>PARKING</em></span></span>
    </a>
    <a class="btn btn-ghost btn-sm" href="index.html">回首頁</a>
  </div>
</header>

<main class="app-main">
  <div class="wrap">
    <div class="panel auth-box">
      <div class="auth-logo"><img src="assets/logo.png" alt="富格停車"></div>
      <h2 class="center" id="auth-title">會員登入／註冊</h2>
      <p class="sub center">登入後即可申請月租車位、查詢申請進度</p>

      <div id="msg" class="msg hidden" role="alert"></div>

      <div id="auth-main">
        <button class="btn btn-google" id="btn-google" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          使用 Google 帳號登入
        </button>

        <div class="divider">或</div>

        <div class="tabs" role="tablist">
          <button type="button" class="on" data-tab="login" role="tab">Email 登入</button>
          <button type="button" data-tab="signup" role="tab">Email 註冊</button>
          <button type="button" data-tab="phone" role="tab" id="tab-phone">手機登入</button>
        </div>

        <!-- Email 登入 -->
        <form id="form-login" autocomplete="on" novalidate>
          <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" autocomplete="email" required maxlength="120"></div>
          <div class="field"><label for="li-pass">密碼</label><input id="li-pass" type="password" autocomplete="current-password" required maxlength="72"></div>
          <button class="btn btn-orange full" type="submit">登入</button>
          <p class="legal"><a href="#" id="link-forgot">忘記密碼？</a></p>
        </form>

        <!-- Email 註冊 -->
        <form id="form-signup" class="hidden" autocomplete="on" novalidate>
          <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required maxlength="120"></div>
          <div class="field"><label for="su-pass">設定密碼</label><input id="su-pass" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><div class="hint">至少 8 個字元，建議英文加數字</div></div>
          <div class="field"><label for="su-pass2">再輸入一次密碼</label><input id="su-pass2" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div>
          <button class="btn btn-orange full" type="submit">註冊</button>
          <p class="legal">註冊後會寄驗證信到您的信箱，點信中連結即完成註冊。</p>
        </form>

        <!-- 手機登入 -->
        <form id="form-phone" class="hidden" novalidate>
          <div class="field"><label for="ph-num">手機號碼</label><input id="ph-num" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678" maxlength="12"></div>
          <div class="field hidden" id="ph-code-row"><label for="ph-code">簡訊驗證碼</label><input id="ph-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
          <button class="btn btn-orange full" type="submit" id="ph-btn">傳送驗證碼</button>
          <p class="legal">第一次使用手機登入會自動建立會員帳號。</p>
        </form>
      </div>

      <!-- 忘記密碼 -->
      <form id="form-forgot" class="hidden" novalidate>
        <div class="field"><label for="fg-email">註冊時的 Email</label><input id="fg-email" type="email" autocomplete="email" maxlength="120"></div>
        <button class="btn btn-orange full" type="submit">寄送重設密碼信</button>
        <p class="legal"><a href="#" id="link-back">返回登入</a></p>
      </form>

      <!-- 設定新密碼（從重設信回來） -->
      <form id="form-newpass" class="hidden" novalidate>
        <div class="field"><label for="np-pass">新密碼</label><input id="np-pass" type="password" autocomplete="new-password" minlength="8" maxlength="72"></div>
        <div class="field"><label for="np-pass2">再輸入一次</label><input id="np-pass2" type="password" autocomplete="new-password" minlength="8" maxlength="72"></div>
        <button class="btn btn-orange full" type="submit">更新密碼</button>
      </form>

      <div id="captcha" class="captcha hidden"></div>

      <p class="legal">登入即表示您同意本站<a href="privacy.html">隱私權政策</a></p>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/vendor/supabase-2.49.10.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
